<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Notes</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
}
header {
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}
.container {
  padding: 15px;
}
.card {
  background: rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
  backdrop-filter: blur(10px);
}
button {
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  background: #ff7eb3;
  color: white;
  cursor: pointer;
  margin-top: 5px;
}
input, textarea {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border-radius: 8px;
  border: none;
}
.hidden { display: none; }
img { max-width: 100%; margin-top: 10px; border-radius: 10px; }
.nav {
  margin-bottom: 10px;
}
.bg-picker {
  display: flex;
  gap: 10px;
}
.bg-box {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
}
</style>
</head>
<body>
<header>📚 Study Notes App</header>
<div class="container"><div id="home">
  <h3>Subjects</h3>
  <input id="subjectInput" placeholder="Add subject">
  <button onclick="addSubject()">Add Subject</button>
  <div id="subjects"></div>
</div><div id="topicsPage" class="hidden">
  <div class="nav">
    <button onclick="goHome()">⬅ Back</button>
  </div>
  <h3 id="topicTitle"></h3>
  <input id="topicInput" placeholder="Add topic">
  <button onclick="addTopic()">Add Topic</button>
  <div id="topics"></div>
</div><div id="notesPage" class="hidden">
  <div class="nav">
    <button onclick="goTopics()">⬅ Back</button>
  </div>
  <h3 id="notesTitle"></h3>  <textarea id="noteText" placeholder="Write notes..."></textarea>  <input type="file" accept="image/*" onchange="addImage(event)">
  <button onclick="saveNote()">Save</button>  <h4>Background</h4>
  <div class="bg-picker">
    <div class="bg-box" style="background:#667eea" onclick="setBg('#667eea')"></div>
    <div class="bg-box" style="background:#ff7eb3" onclick="setBg('#ff7eb3')"></div>
    <div class="bg-box" style="background:#00c9a7" onclick="setBg('#00c9a7')"></div>
    <div class="bg-box" style="background:#f9d423" onclick="setBg('#f9d423')"></div>
  </div>  <div id="images"></div>
</div></div><script>
let data = JSON.parse(localStorage.getItem('studyData')) || {};
let currentSubject = null;
let currentTopic = null;

function saveData() {
  localStorage.setItem('studyData', JSON.stringify(data));
}

function renderSubjects() {
  let container = document.getElementById('subjects');
  container.innerHTML = '';
  Object.keys(data).forEach(sub => {
    let div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `${sub} <br>
      <button onclick="openSubject('${sub}')">Open</button>
      <button onclick="deleteSubject('${sub}')">Delete</button>`;
    container.appendChild(div);
  });
}

function addSubject() {
  let val = document.getElementById('subjectInput').value;
  if (!val) return;
  data[val] = {};
  saveData();
  renderSubjects();
}

function deleteSubject(sub) {
  delete data[sub];
  saveData();
  renderSubjects();
}

function openSubject(sub) {
  currentSubject = sub;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('topicsPage').classList.remove('hidden');
  document.getElementById('topicTitle').innerText = sub;
  renderTopics();
}

function goHome() {
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('topicsPage').classList.add('hidden');
}

function renderTopics() {
  let container = document.getElementById('topics');
  container.innerHTML = '';
  let topics = data[currentSubject];
  Object.keys(topics).forEach(t => {
    let div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `${t}<br>
      <button onclick="openTopic('${t}')">Open</button>
      <button onclick="deleteTopic('${t}')">Delete</button>`;
    container.appendChild(div);
  });
}

function addTopic() {
  let val = document.getElementById('topicInput').value;
  if (!val) return;
  data[currentSubject][val] = { text:'', images:[], bg:'' };
  saveData();
  renderTopics();
}

function deleteTopic(t) {
  delete data[currentSubject][t];
  saveData();
  renderTopics();
}

function openTopic(t) {
  currentTopic = t;
  document.getElementById('topicsPage').classList.add('hidden');
  document.getElementById('notesPage').classList.remove('hidden');
  document.getElementById('notesTitle').innerText = t;
  loadNote();
}

function goTopics() {
  document.getElementById('notesPage').classList.add('hidden');
  document.getElementById('topicsPage').classList.remove('hidden');
}

function loadNote() {
  let note = data[currentSubject][currentTopic];
  document.getElementById('noteText').value = note.text;
  document.body.style.background = note.bg || 'linear-gradient(135deg, #667eea, #764ba2)';

  let imgDiv = document.getElementById('images');
  imgDiv.innerHTML = '';
  note.images.forEach(src => {
    let img = document.createElement('img');
    img.src = src;
    imgDiv.appendChild(img);
  });
}

function saveNote() {
  let note = data[currentSubject][currentTopic];
  note.text = document.getElementById('noteText').value;
  saveData();
  alert('Saved');
}

function addImage(event) {
  let file = event.target.files[0];
  let reader = new FileReader();
  reader.onload = function() {
    data[currentSubject][currentTopic].images.push(reader.result);
    saveData();
    loadNote();
  };
  reader.readAsDataURL(file);
}

function setBg(color) {
  data[currentSubject][currentTopic].bg = color;
  document.body.style.background = color;
  saveData();
}

renderSubjects();
</script></body>
</html>
